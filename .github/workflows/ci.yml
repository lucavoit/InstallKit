# InstallKit's own CI. The Azure DevOps templates in pipelines/ are for consumers and are not used here.
name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Unit tests and pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore pinned WiX tool
        run: dotnet tool restore

      - name: Unit tests
        run: dotnet test tests/InstallKit.Abstractions.Tests -c Release

      - name: Pack SDK, engines and templates
        run: dotnet pack InstallKit.slnx -c Release -p:InstallKitVersion=0.1.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg

  samples:
    name: Sample (${{ matrix.engine }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: WixSharp
            project: samples/HelloService.Installer/HelloService.Installer.csproj
          - engine: WixSharpCore
            project: samples/HelloService.Installer.Core/HelloService.Installer.Core.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore pinned WiX tool
        run: dotnet tool restore

      - name: Build sample installer
        run: dotnet build ${{ matrix.project }} -c Release -p:InstallKitVersion=1.0.${{ github.run_number }} "-p:InstallKitOutputDir=${{ runner.temp }}/sample/"

      - uses: actions/upload-artifact@v4
        with:
          name: sample-${{ matrix.engine }}
          path: ${{ runner.temp }}/sample

  # End-to-end: build the QA demo installer as 1.0.0 and 1.1.0, then install, upgrade, repair and
  # uninstall it on the runner and assert the outcome with Pester (qa/tests/Installer.Tests.ps1).
  # Hosted runners are disposable and run as administrator, which these tests need.
  qa:
    name: QA (${{ matrix.engine }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: WixSharp
            project: qa/QaDemo.Installer/QaDemo.Installer.csproj
          - engine: WixSharpCore
            project: qa/QaDemo.Installer.Core/QaDemo.Installer.Core.csproj
    env:
      QA_DIR: ${{ github.workspace }}/qa-out
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore pinned WiX tool
        run: dotnet tool restore

      - name: Build QA installer 1.0.0
        run: dotnet build ${{ matrix.project }} -c Release -p:InstallKitVersion=1.0.0 "-p:InstallKitOutputDir=${{ env.QA_DIR }}/1.0.0/"

      - name: Build QA installer 1.1.0
        run: dotnet build ${{ matrix.project }} -c Release -p:InstallKitVersion=1.1.0 "-p:InstallKitOutputDir=${{ env.QA_DIR }}/1.1.0/"

      - name: Install, upgrade, repair, uninstall and assert
        shell: pwsh
        run: ./qa/tests/Invoke-Qa.ps1 -V1 "$env:QA_DIR/1.0.0" -V2 "$env:QA_DIR/1.1.0" -LogDir "$env:QA_DIR/logs" -ResultFile "$env:QA_DIR/qa-results.xml"

      - name: Upload installers, logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.engine }}
          path: ${{ env.QA_DIR }}
