# InstallKit's own CI. The Azure DevOps templates in pipelines/ are for consumers and are not used here.
name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Unit tests and pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore pinned WiX tool
        run: dotnet tool restore

      - name: Unit tests
        run: dotnet test tests/InstallKit.Abstractions.Tests -c Release

      - name: Tool unit tests
        run: dotnet test tests/InstallKit.Tool.Tests -c Release

      - name: Modern dialog tests
        run: dotnet test tests/InstallKit.WixSharp.Tests -c Release

      - name: Engine tests
        run: dotnet test tests/InstallKit.WixSharp.Engine.Tests -c Release

      - name: Pack SDK, engines and templates
        run: dotnet pack InstallKit.slnx -c Release -p:InstallKitBuildOnBuild=true -p:InstallKitVersion=0.1.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg

  samples:
    name: Sample (${{ matrix.engine }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: WixSharp
            project: samples/HelloService.Installer/HelloService.Installer.csproj
          - engine: WixSharpCore
            project: samples/HelloService.Installer.Core/HelloService.Installer.Core.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore pinned WiX tool
        run: dotnet tool restore

      - name: Build sample installer
        run: dotnet build ${{ matrix.project }} -c Release -p:InstallKitBuildOnBuild=true -p:InstallKitVersion=1.0.${{ github.run_number }} "-p:InstallKitOutputDir=${{ runner.temp }}/sample/"

      - uses: actions/upload-artifact@v4
        with:
          name: sample-${{ matrix.engine }}
          path: ${{ runner.temp }}/sample

  # Clicks through the real setup dialogs of the QA demo MSI with UI Automation (qa/UiTests, FlaUI). The other checks look
  # at the MSI tables or run msiexec silently; this one sees what a person sees. Hosted Windows runners have an
  # interactive desktop and run as administrator. Every run uploads the UI trees, screenshots and msiexec logs.
  # The tour tests (TourTests) photograph every page of the install, repair and remove flows and the bundle window, in the
  # dark theme (the default) on both engines and in the light theme on one: download the ui-* artifacts of the run to look at them.
  ui:
    name: UI (${{ matrix.engine }}, ${{ matrix.theme }}${{ matrix.pref && format(' {0}', matrix.pref) || '' }}${{ matrix.ui && format(', {0}', matrix.ui) || '' }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: WixSharp
            theme: dark
            project: qa/QaDemo.Installer/QaDemo.Installer.csproj
          - engine: WixSharpCore
            theme: dark
            project: qa/QaDemo.Installer.Core/QaDemo.Installer.Core.csproj
          - engine: WixSharp
            theme: light
            project: qa/QaDemo.Installer/QaDemo.Installer.csproj
          # The flat WPF UI (Appearance.Flat), WixSharp engine only (the Core engine falls back to the native dialogs).
          - engine: WixSharp
            theme: dark
            ui: flat
            project: qa/QaDemo.Installer/QaDemo.Installer.csproj
          - engine: WixSharp
            theme: light
            ui: flat
            project: qa/QaDemo.Installer/QaDemo.Installer.csproj
          # Theme Auto follows the Windows app mode: the preference is set before the tests, once to light and once to dark.
          # These two choose no UI at all (qa_ui: default), which is the flat UI with this engine.
          - engine: WixSharp
            theme: auto
            pref: light
            ui: flat
            qa_ui: default
            project: qa/QaDemo.Installer/QaDemo.Installer.csproj
          - engine: WixSharp
            theme: auto
            pref: dark
            ui: flat
            qa_ui: default
            project: qa/QaDemo.Installer/QaDemo.Installer.csproj
    env:
      QA_DIR: ${{ github.workspace }}/qa-out
      INSTALLKIT_UI_OUT: ${{ github.workspace }}/ui-out
      QA_THEME: ${{ matrix.theme }}
      QA_UI: ${{ matrix.qa_ui || matrix.ui }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore pinned WiX tool
        run: dotnet tool restore

      - name: Build QA installer 1.0.0
        run: dotnet build ${{ matrix.project }} -c Release -p:InstallKitBuildOnBuild=true -p:InstallKitVersion=1.0.0 "-p:InstallKitOutputDir=${{ env.QA_DIR }}/1.0.0/"

      - name: Set the Windows app mode preference
        if: matrix.pref != ''
        shell: pwsh
        run: |
          $value = if ('${{ matrix.pref }}' -eq 'light') { 1 } else { 0 }
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v AppsUseLightTheme /t REG_DWORD /d $value /f

      - name: Drive the setup dialogs
        shell: pwsh
        env:
          INSTALLKIT_UI_MSI: ${{ github.workspace }}/qa-out/1.0.0/QaDemo.msi
          INSTALLKIT_UI_BUNDLE: ${{ github.workspace }}/qa-out/1.0.0/QaDemoSetup.exe
          INSTALLKIT_UI_FLAT: ${{ matrix.ui == 'flat' && '1' || '0' }}
        run: dotnet test qa/UiTests -c Release --logger "console;verbosity=detailed"

      - name: List the screenshots
        if: always()
        shell: pwsh
        run: |
          $shots = Get-ChildItem "$env:INSTALLKIT_UI_OUT" -Filter *.png -ErrorAction SilentlyContinue | Sort-Object Name
          "### Screenshots (${{ matrix.engine }}, ${{ matrix.theme }}${{ matrix.pref && format(' {0}', matrix.pref) || '' }}${{ matrix.ui && format(', {0}', matrix.ui) || '' }})" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if (-not $shots) { "No screenshots were taken." | Out-File $env:GITHUB_STEP_SUMMARY -Append }
          else {
            "$($shots.Count) pictures, one per page: download the **ui-${{ matrix.engine }}-${{ matrix.theme }}${{ matrix.pref && format('-{0}', matrix.pref) || '' }}${{ matrix.ui && format('-{0}', matrix.ui) || '' }}** artifact of this run." | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            $shots | ForEach-Object { "- ``$($_.Name)``" } | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload UI trees, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.engine }}-${{ matrix.theme }}${{ matrix.pref && format('-{0}', matrix.pref) || '' }}${{ matrix.ui && format('-{0}', matrix.ui) || '' }}
          path: ${{ env.INSTALLKIT_UI_OUT }}
          if-no-files-found: warn

  # End-to-end: build the QA demo installer as 1.0.0 and 1.1.0, then install, upgrade, repair and
  # uninstall it on the runner and assert the outcome with Pester (qa/tests/Installer.Tests.ps1).
  # Hosted runners are disposable and run as administrator, which these tests need.
  qa:
    name: QA (${{ matrix.engine }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: WixSharp
            project: qa/QaDemo.Installer/QaDemo.Installer.csproj
          - engine: WixSharpCore
            project: qa/QaDemo.Installer.Core/QaDemo.Installer.Core.csproj
    env:
      QA_DIR: ${{ github.workspace }}/qa-out
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore pinned WiX tool
        run: dotnet tool restore

      - name: Build QA installer 1.0.0
        run: dotnet build ${{ matrix.project }} -c Release -p:InstallKitBuildOnBuild=true -p:InstallKitVersion=1.0.0 "-p:InstallKitOutputDir=${{ env.QA_DIR }}/1.0.0/"

      - name: Build QA installer 1.1.0
        run: dotnet build ${{ matrix.project }} -c Release -p:InstallKitBuildOnBuild=true -p:InstallKitVersion=1.1.0 "-p:InstallKitOutputDir=${{ env.QA_DIR }}/1.1.0/"

      # A patch release of the first line, to test that it replaces 1.0.0 while 1.1.0 stays installed side by side.
      - name: Build QA installer 1.0.1
        run: dotnet build ${{ matrix.project }} -c Release -p:InstallKitBuildOnBuild=true -p:InstallKitVersion=1.0.1 "-p:InstallKitOutputDir=${{ env.QA_DIR }}/1.0.1/"

      # ICE is Windows Installer's own consistency check of the MSI tables: dialogs, control events, components,
      # directories. It catches mistakes that only show up when someone clicks through the setup.
      - name: Validate the built MSIs (ICE)
        shell: pwsh
        run: |
          foreach ($msi in Get-ChildItem "$env:QA_DIR/1.0.0/*.msi") {
            Write-Host "::group::wix msi validate $($msi.Name)"
            dotnet wix msi validate $msi.FullName
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -ne 0) { throw "ICE validation of $($msi.Name) failed with exit code $code." }
          }

      - name: Check the installkit tool against the built MSIs
        shell: pwsh
        run: ./qa/tests/Invoke-ToolChecks.ps1 -V1 "$env:QA_DIR/1.0.0" -V2 "$env:QA_DIR/1.1.0"

      - name: Install, upgrade, repair, uninstall and assert
        shell: pwsh
        run: ./qa/tests/Invoke-Qa.ps1 -V1 "$env:QA_DIR/1.0.0" -V2 "$env:QA_DIR/1.1.0" -V1Patch "$env:QA_DIR/1.0.1" -LogDir "$env:QA_DIR/logs" -ResultFile "$env:QA_DIR/qa-results.xml"

      - name: Upload installers, logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.engine }}
          path: ${{ env.QA_DIR }}

  # A user without a monorepo: an installer project outside this repository, built only from the
  # packed NuGet packages and the template, with the payload taken from a folder another pipeline made.
  consumer:
    name: Consumer (${{ matrix.engine }})
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [ WixSharp, WixSharpCore ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - name: Build the consumer installer from the packed packages
        shell: pwsh
        run: ./qa/consumer/Build-Consumer.ps1 -PackagesDir "${{ runner.temp }}/packages" -WorkDir "${{ runner.temp }}/consumer" -Engine ${{ matrix.engine }}

      - name: Install and uninstall it and assert
        shell: pwsh
        run: |
          $container = New-PesterContainer -Path qa/tests/Consumer.Tests.ps1 -Data @{ OutDir = "${{ runner.temp }}/consumer/out"; LogDir = "${{ runner.temp }}/consumer/logs" }
          Invoke-Pester -Container $container -Output Detailed -CI

      - name: Upload installers and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-${{ matrix.engine }}
          path: ${{ runner.temp }}/consumer/out
