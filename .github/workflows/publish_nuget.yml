# Publishes the InstallKit NuGet packages to nuget.org when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Uses nuget.org trusted publishing (OIDC), so no API key is stored in this repository.
# One-time setup on nuget.org: add a trusted publisher policy for this repository with the workflow
# file `publish_nuget.yml` and the environment `nuget`, and set the repository secret NUGET_USER
# to the nuget.org profile name that owns the policy.
name: Publish NuGet

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and pack
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get the version from the tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw "Tag '$tag' is not a version tag like v1.2.3 or v1.2.3-preview.1." }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      # Only release what is on main, so a tag on a stray branch can't publish.
      - name: Check that the tag is on main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:GITHUB_REF_NAME ($env:GITHUB_SHA) is not on main." }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore pinned WiX tool
        run: dotnet tool restore

      - name: Unit tests
        run: dotnet test tests/InstallKit.Abstractions.Tests -c Release

      - name: Pack
        run: dotnet pack InstallKit.slnx -c Release -p:InstallKitVersion=${{ steps.version.outputs.version }}

      # A missing or extra package means the release is wrong; stop before anything is pushed.
      - name: Check the package set
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $expected = 'InstallKit.Abstractions', 'InstallKit.Sdk', 'InstallKit.Templates', 'InstallKit.WixSharp', 'InstallKit.WixSharp.Core' |
              ForEach-Object { "$_.$version.nupkg" } | Sort-Object
          $actual = Get-ChildItem artifacts/packages -Filter *.nupkg | ForEach-Object Name | Sort-Object
          Write-Host ($actual -join "`n")
          if (Compare-Object $expected $actual) { throw "Unexpected package set. Expected: $($expected -join ', ')" }

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  # Build the installers from these exact packages before they are published.
  verify:
    name: Verify the packages (${{ matrix.engine }})
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [ WixSharp, WixSharpCore ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - name: Build a consumer installer from the packed packages
        shell: pwsh
        run: ./qa/consumer/Build-Consumer.ps1 -PackagesDir "${{ runner.temp }}/packages" -WorkDir "${{ runner.temp }}/consumer" -Engine ${{ matrix.engine }}

      - name: Install, uninstall and assert
        shell: pwsh
        run: |
          $container = New-PesterContainer -Path qa/tests/Consumer.Tests.ps1 -Data @{ OutDir = "${{ runner.temp }}/consumer/out"; LogDir = "${{ runner.temp }}/consumer/logs" }
          Invoke-Pester -Container $container -Output Detailed -CI

  publish:
    name: Push to nuget.org
    needs: [ build, verify ]
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repository settings to approve each release.
    environment: nuget
    permissions:
      id-token: write   # trusted publishing: exchanged for a short-lived nuget.org API key
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Log in to nuget.org with trusted publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate lets a failed run be re-run without erroring on packages that already went up.
      - name: Push packages
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push symbol packages
        run: dotnet nuget push "packages/*.snupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
