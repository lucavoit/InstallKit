# Publishes a folder of installers to an Azure Artifacts feed as a Universal Package.
parameters:
  - name: feed                    # 'feedName' (organisation-scoped) or 'project/feedName'
    type: string
  - name: packageName             # lowercase, e.g. my-product
    type: string
  - name: version                 # SemVer, e.g. 1.4.27
    type: string
  - name: directory
    type: string
  - name: description
    type: string
    default: ''

steps:
  - task: UniversalPackages@0
    displayName: Publish ${{ parameters.packageName }} ${{ parameters.version }} to ${{ parameters.feed }}
    inputs:
      command: publish
      publishDirectory: ${{ parameters.directory }}
      feedsToUsePublish: internal
      vstsFeedPublish: ${{ parameters.feed }}
      vstsFeedPackagePublish: ${{ parameters.packageName }}
      versionOption: custom
      versionPublish: ${{ parameters.version }}
      packagePublishDescription: ${{ parameters.description }}
